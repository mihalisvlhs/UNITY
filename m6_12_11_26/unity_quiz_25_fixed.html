<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg: #18191c;
      --card-bg: #22252a;
      --card-border: #353941;
      --accent: #3a86ff;
      --accent-hover: #2563eb;
      --text: #f3f4f6;
      --text-muted: #9ca3af;

    * {

      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
    }
    .wrapper {
      max-width: 840px;
      width: 100%;
    }

      border: 1px solid var(--card-border);

      padding: 25px;
      text-align: center;
      margin-bottom: 25px;

      margin-bottom: 8px;
    }

      font-size: 1.05rem;
    }

      background: var(--card-bg);
      border: 2px solid var(--accent);
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 25px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(58, 134, 255, 0.25);

      font-size: 0.85rem;
      padding: 3px 9px;

      font-weight: bold;
      white-space: nowrap;
    }
    .options-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .opt-label {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }
    .opt-label:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent);
    }
    .opt-label input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .explanation {
      display: none;
      margin-top: 15px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      background: rgba(255, 255, 255, 0.05);
      border-left: 4px solid var(--accent);
    }
    .is-correct-card {
      border-color: var(--correct) !important;
    }
    .is-wrong-card {
      border-color: var(--wrong) !important;
    }
    .opt-correct-highlight {
      background: var(--correct-bg) !important;
      border-color: var(--correct) !important;
      color: #86efac;
      font-weight: 600;
    }
    .opt-wrong-highlight {
      background: var(--wrong-bg) !important;
      border-color: var(--wrong) !important;
      color: #fca5a5;
    }
    .buttons-bar {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin: 30px 0 50px 0;
    }
    button {
      cursor: pointer;
      padding: 14px 32px;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 600;
      transition: all 0.2s ease;
      border: none;
    }

      background: var(--accent);
      color: #fff;
    }
    .btn-submit:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }
    .btn-reset {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--card-border);
    }
    .btn-reset:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }

</head>

function buildQuizUI() {
  const container = document.getElementById("questions-list");
  if (!container) return;
  container.innerHTML = "";

  quizQuestions.forEach((item, qIndex) => {
    const card = document.createElement("div");
    card.className = "question-card";
    card.id = "card-" + qIndex;

    const title = document.createElement("div");
    title.className = "question-title";
    title.innerHTML = '<span class="q-badge">Ερ. ' + (qIndex + 1) + '</span> <span>' + item.question + '</span>';
    card.appendChild(title);

    const group = document.createElement("div");
    group.className = "options-group";

    item.choices.forEach((choiceText, optIndex) => {
      const label = document.createElement("label");
      label.className = "opt-label";
      label.id = "lbl-" + qIndex + "-" + optIndex;

      const radio = document.createElement("input");
      radio.type = "radio";
      radio.name = "question_" + qIndex;
      radio.value = optIndex;

      label.appendChild(radio);
      label.appendChild(document.createTextNode(choiceText));
      group.appendChild(label);
    });

    card.appendChild(group);

    const exp = document.createElement("div");
    exp.className = "explanation";
    exp.id = "exp-" + qIndex;
    exp.innerHTML = "<strong>Σωστή Απάντηση / Επεξήγηση:</strong> " + item.explanation;
    card.appendChild(exp);

    container.appendChild(card);
  });
}

function gradeQuiz() {
  let score = 0;

  quizQuestions.forEach((item, qIndex) => {
    const card = document.getElementById("card-" + qIndex);
    const exp = document.getElementById("exp-" + qIndex);
    const selected = document.querySelector('input[name="question_' + qIndex + '"]:checked');

    card.classList.remove("is-correct-card", "is-wrong-card");
    item.choices.forEach((_, optIndex) => {
      const lbl = document.getElementById("lbl-" + qIndex + "-" + optIndex);
      lbl.classList.remove("opt-correct-highlight", "opt-wrong-highlight");
    });

    // Επισημαίνουμε πάντα τη σωστή επιλογή με πράσινο
    const correctLabel = document.getElementById("lbl-" + qIndex + "-" + item.answer);
    correctLabel.classList.add("opt-correct-highlight");

    if (selected) {
      const chosen = parseInt(selected.value, 10);
      if (chosen === item.answer) {
        score++;
        card.classList.add("is-correct-card");
      } else {
        card.classList.add("is-wrong-card");
        const chosenLabel = document.getElementById("lbl-" + qIndex + "-" + chosen);
        chosenLabel.classList.add("opt-wrong-highlight");
      }
    } else {
      card.classList.add("is-wrong-card");
    }

    exp.style.display = "block";
  });

  const banner = document.getElementById("score-box");
  const scoreText = document.getElementById("score-text");
  const scoreDesc = document.getElementById("score-desc");

  banner.style.display = "block";
  scoreText.textContent = score + " / " + quizQuestions.length;

  const pct = Math.round((score / quizQuestions.length) * 100);
  if (pct === 100) {
    scoreDesc.textContent = "Άριστα! (100%) Όλες οι απαντήσεις είναι σωστές!";
  } else if (pct >= 80) {
    scoreDesc.textContent = "Πολύ καλά! (" + pct + "%) Πολύ καλή γνώση των βασικών εργαστηρίων.";
  } else if (pct >= 50) {
    scoreDesc.textContent = "Καλή προσπάθεια (" + pct + "%). Δείτε τις επεξηγήσεις στις ερωτήσεις που χάθηκαν.";
  } else {
    scoreDesc.textContent = "Χρειάζεται επανάληψη στις σημειώσεις (" + pct + "%).";
  }

  window.scrollTo({ top: 0, behavior: "smooth" });
}

function resetForm() {
  document.getElementById("quiz-form").reset();
  const banner = document.getElementById("score-box");
  banner.style.display = "none";

  quizQuestions.forEach((item, qIndex) => {
    const card = document.getElementById("card-" + qIndex);
    const exp = document.getElementById("exp-" + qIndex);
    card.classList.remove("is-correct-card", "is-wrong-card");
    exp.style.display = "none";

    item.choices.forEach((_, optIndex) => {
      const lbl = document.getElementById("lbl-" + qIndex + "-" + optIndex);
      lbl.classList.remove("opt-correct-highlight", "opt-wrong-highlight");
    });
  });

  window.scrollTo({ top: 0, behavior: "smooth" });
}

// Εκκίνηση με τη φόρτωση της σελίδας
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", buildQuizUI);
} else {
  buildQuizUI();
}
</script>
</body>
</html>
